<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 日本东京・大阪行程地图</title>
    
    <!-- Google Fonts: Inter & Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full Screen Map -->
    <div id="map" class="map-fullscreen"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        
        <!-- Header -->
        <header class="app-header glass-panel">
            <div class="logo-area">
                <i class="fa-solid fa-map-location-dot"></i>
                <h1>日本巡游 2026</h1>
            </div>
            <div class="controls-area">
                <select id="trip-selector" class="modern-select">
                    <!-- Options will be populated by JS -->
                </select>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="content-wrapper">
            
            <!-- Mobile Overlay Mask -->
            <div class="mobile-mask" id="mobile-mask"></div>

            <!-- Left Sidebar: Days & Segments -->
            <aside class="sidebar sidebar-left glass-panel" id="sidebar-left">
                <div class="sidebar-header">
                    <h2>行程日程</h2>
                    <p>选择日期查看详细路线</p>
                    <button class="close-btn mobile-only" id="close-left-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="days-list" id="days-list">
                    <!-- Days will be populated by JS -->
                </div>
            </aside>

            <!-- Right Sidebar: Overview & Details -->
            <aside class="sidebar sidebar-right glass-panel" id="sidebar-right">
                <div class="sidebar-header overview-header" id="overview-panel">
                    <!-- Overview header populated by JS -->
                    <div class="empty-state">
                        <i class="fa-solid fa-route"></i>
                        <p>请在左侧选择一天以查看详情</p>
                    </div>
                </div>
                <!-- Timeline layout for places -->
                <div class="places-list timeline-container" id="places-list">
                    <!-- Places will be populated by JS -->
                </div>
            </aside>

        </div>

        <!-- Mobile Floating Action Buttons (FABs) -->
        <div class="fab-container mobile-only">
            <button class="fab fab-primary" id="fab-schedule">
                <i class="fa-solid fa-calendar-days"></i>
                <span>日程</span>
            </button>
            <button class="fab fab-secondary" id="fab-details">
                <i class="fa-solid fa-list-ul"></i>
                <span>详情</span>
            </button>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
